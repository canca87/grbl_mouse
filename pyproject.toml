[project]
name = "grbl-mouse"
version = "0.1.0"
description = "Kensington Expert Mouse -> GRBL XYZ stage jog controller"
requires-python = ">=3.10"
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
